# Builds an UNSIGNED iPhone app (.ipa) on GitHub's free macOS machines.
# SideStore signs it on the phone with a free Apple ID. No Apple Developer Program needed.
# Start it from the Actions tab ("Run workflow") or: gh workflow run ios-build.yml -f variant=prod
name: iOS build (unsigned, for SideStore)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'prod = the normal app (both phones) · dev = development client (only for the dev phone)'
        required: true
        default: prod
        type: choice
        options: [prod, dev]

permissions:
  contents: write # attach the .ipa to a release so it outlives the 7-day artifact

concurrency:
  group: ios-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_VARIANT: ${{ inputs.variant }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      CI: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Select Xcode 26.6 (Expo SDK 57 needs 26.4+)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Check native config before spending build minutes
        run: node scripts/check-native-config.mjs

      - name: Restore CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ inputs.variant }}-${{ hashFiles('package-lock.json') }}

      - name: Install pods
        run: cd ios && pod install

      - name: Build (unsigned)
        run: |
          CONFIG=Release
          if [ "$APP_VARIANT" = "dev" ]; then CONFIG=Debug; fi
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration "$CONFIG" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { tail -n 200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/xcodebuild.log"

      - name: Package the .ipa
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app | head -1)
          rm -rf "$RUNNER_TEMP/Payload" && mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry "Us-$APP_VARIANT.ipa" Payload
          ls -la "$RUNNER_TEMP/Us-$APP_VARIANT.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: Us-${{ inputs.variant }}-ipa
          path: ${{ runner.temp }}/Us-${{ inputs.variant }}.ipa
          retention-days: 7

      - name: Attach to the "latest" release (private repo = private release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-${APP_VARIANT}-latest"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "Us (${APP_VARIANT}) — latest build" --prerelease \
              --notes "Unsigned .ipa for SideStore. Install: send it to the iPhone (LocalSend/Files), open SideStore → + → choose the file."
          gh release upload "$TAG" "$RUNNER_TEMP/Us-$APP_VARIANT.ipa" --clobber
          gh release edit "$TAG" --notes "Unsigned .ipa for SideStore, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Install: send it to the iPhone (LocalSend/Files), open SideStore → + → choose the file."

      - name: Upload the build log if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log-${{ inputs.variant }}
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 3
